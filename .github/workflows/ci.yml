name: Groupia verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - run: python tools/check_migrations.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/scan_secrets.py
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: git diff --check
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: security
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Verify including architecture, migration and PostgreSQL integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
        env:
          SPRING_CONFIG_IMPORT: ''
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: backend-test-results
          path: Backend/target/surefire-reports/TEST-*.xml
          retention-days: 3
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: security
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Temporary dependency repair preview (non-mutating)
        if: github.head_ref == 'ux-ui-foundations-v2'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const d of [p.dependencies,p.devDependencies])for(const name of Object.keys(d))if(name.startsWith('@angular/'))d[name]='22.2.3';p.overrides={'@angular/build':{'vite':'8.3.3'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          echo GROUPIA_PACKAGE_BEGIN
          base64 -w0 package.json
          echo
          echo GROUPIA_PACKAGE_END
          echo GROUPIA_LOCK_BEGIN
          base64 -w0 package-lock.json
          echo
          echo GROUPIA_LOCK_END
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 3
