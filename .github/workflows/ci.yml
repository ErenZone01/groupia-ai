name: Groupia verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - run: python tools/check_migrations.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/scan_secrets.py
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: git diff --check
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: security
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Verify including architecture, migration and PostgreSQL integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
        env:
          SPRING_CONFIG_IMPORT: ''
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: backend-test-results
          path: Backend/target/surefire-reports/TEST-*.xml
          retention-days: 3
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: security
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Audit dependency risks (production strict; documented dev-only exception)
        run: python ../tools/check_frontend_audit.py
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 3
