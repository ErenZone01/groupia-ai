name: One-shot direct Bictorys Java formatting
on:
  push:
    branches: [direct-sales-bictorys-initiation-gated-v1]
    paths:
      - '.github/workflows/format-direct-bictorys-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: direct-sales-bictorys-initiation-gated-v1
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Format edited Java with the project's Spotless config
        working-directory: Backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/format-direct-bictorys-once.yml
          git add -- Backend/src/main/java/sn/groupia/payment/api/DirectPaymentClaimGuard.java Backend/src/main/java/sn/groupia/payment/api/PaymentOperations.java Backend/src/main/java/sn/groupia/payment/application/service/PaymentService.java Backend/src/main/java/sn/groupia/payment/application/service/PaymentTransactions.java Backend/src/main/java/sn/groupia/directsales/application/DirectPaymentClaimAuthorization.java Backend/src/main/java/sn/groupia/directsales/application/DirectCustomerPaymentInitiation.java Backend/src/main/java/sn/groupia/directsales/infrastructure/DirectCustomerPaymentInitiationController.java Backend/src/test/java/sn/groupia/payment/application/service/DirectPaymentClaimEnabledTests.java Backend/src/test/java/sn/groupia/directsales/application/DirectPaymentClaimAuthorizationTests.java Backend/src/test/java/sn/groupia/directsales/application/DirectCustomerPaymentInitiationTests.java
          git diff --cached --check
          git commit -m "style(payment): run pinned Spotless AOSP formatting for direct initiation"
          git push origin HEAD:direct-sales-bictorys-initiation-gated-v1
