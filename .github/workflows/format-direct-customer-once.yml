name: One-shot Java formatting for direct customer financial read
on:
  push:
    branches: [direct-customer-financial-truth-v1]
    paths:
      - '.github/workflows/format-direct-customer-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: direct-customer-financial-truth-v1
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply formatter only to two financial read files, then remove this temporary workflow
        working-directory: Backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Commit only formatted files and delete temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/format-direct-customer-once.yml
          git add -- Backend/src/main/java/sn/groupia/directsales/application/DirectCustomerPaymentStatus.java Backend/src/test/java/sn/groupia/directsales/application/DirectCustomerPaymentStatusTests.java
          git diff --cached --check
          git commit -m "style(direct-sales): apply Spotless AOSP Java formatting"
          git push origin HEAD:direct-customer-financial-truth-v1
