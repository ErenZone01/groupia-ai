name: One-shot direct delivery destination formatting
on:
  push:
    branches: [direct-delivery-destination-visibility-v1]
    paths:
      - '.github/workflows/format-direct-delivery-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: direct-delivery-destination-visibility-v1
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply project Java formatting
        working-directory: Backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Remove one-shot workflow and push formatted code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/format-direct-delivery-once.yml
          git add -- Backend/src/main/java/sn/groupia/directsales/application/DirectOrderQueries.java Backend/src/test/java/sn/groupia/DirectStorefrontIntegrationTests.java
          git diff --cached --check
          git commit -m "style(direct-sales): format merchant delivery location with Spotless"
          git pull --rebase origin direct-delivery-destination-visibility-v1
          git push origin HEAD:direct-delivery-destination-visibility-v1
