name: One-shot canonical settlement time format
on:
  push:
    branches: [direct-bictorys-sandbox-integration-v1]
    paths:
      - '.github/workflows/format-settlement-time-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: direct-bictorys-sandbox-integration-v1
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply pinned Spotless AOSP formatting
        working-directory: Backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Commit formatted files and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/format-settlement-time-once.yml
          git add -- Backend/src/main/java/sn/groupia/payment/domain/model/Payment.java Backend/src/test/java/sn/groupia/DirectBictorysSandboxIntegrationTests.java
          git diff --cached --check
          git commit -m "style(payment): format canonical settlement-time fix and regression"
          git pull --rebase origin direct-bictorys-sandbox-integration-v1
          git push origin HEAD:direct-bictorys-sandbox-integration-v1
