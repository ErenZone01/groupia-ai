name: SasPay audit formatting temporary
on:
  push:
    branches:
      - feat/saspay-history-readonly-audit-20261118
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Format snapshot
        shell: bash
        run: |
          cd Backend
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          for f in \
            src/main/java/sn/groupia/payment/infrastructure/provider/saspay/SaspayClient.java \
            src/main/java/sn/groupia/payment/infrastructure/provider/saspay/SaspayConfiguration.java \
            src/main/java/sn/groupia/payment/infrastructure/provider/saspay/SaspayHistoryAudit.java \
            src/test/java/sn/groupia/payment/infrastructure/provider/saspay/SaspayHistoryAuditTests.java; do
            echo "BEGIN_FORMAT_FILE:$f"
            base64 -w0 "$f"
            echo
            echo "END_FORMAT_FILE:$f"
          done
