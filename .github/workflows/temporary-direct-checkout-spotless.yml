name: Temporary direct-checkout Spotless
on:
  push:
    branches: [direct-checkout-location-enforcement-v1]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ErenZone01/groupia-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: direct-checkout-location-enforcement-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Format targeted Java sources
        working-directory: Backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply
      - name: Commit only the two changed Java files
        shell: bash
        run: |
          git add -- Backend/src/main/java/sn/groupia/directsales/application/DirectCheckoutService.java Backend/src/test/java/sn/groupia/DirectStorefrontIntegrationTests.java
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(direct-checkout): apply project Spotless'
          git push origin HEAD:direct-checkout-location-enforcement-v1
