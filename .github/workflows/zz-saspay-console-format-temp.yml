name: Temporary SasPay console formatting
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Format and encode files
        shell: bash
        run: |
          cd Backend
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          for f in \
            src/main/java/sn/groupia/payment/infrastructure/provider/saspay/SaspayIncidentConsoleService.java \
            src/main/java/sn/groupia/payment/infrastructure/provider/saspay/SaspayIncidentConsoleController.java \
            src/test/java/sn/groupia/SaspayIncidentConsoleIntegrationTests.java; do
            echo "FORMAT_START:$f"
            base64 -w0 "$f"
            echo
            echo "FORMAT_END:$f"
          done
