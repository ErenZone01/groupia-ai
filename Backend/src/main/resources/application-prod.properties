spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
groupia.security.production=true
groupia.security.auth-rate-limit.enabled=true
# Shared proxy topology: actual client-IP quotas belong at the edge.
groupia.security.auth-rate-limit.network-enabled=false
groupia.security.auth-rate-limit.key-base64=${GROUPIA_AUTH_RATE_LIMIT_KEY_BASE64}
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.server.port=${MANAGEMENT_PORT:9091}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
groupia.monitoring.token=${GROUPIA_MONITORING_TOKEN:}
groupia.customer-access.secure-cookie=true
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.SQL=OFF
