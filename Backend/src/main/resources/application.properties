spring.application.name=groupia-ai
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
groupia.security.jwt.secret-base64=${GROUPIA_JWT_SECRET_BASE64}
groupia.security.jwt.issuer=${GROUPIA_JWT_ISSUER:groupia}
groupia.security.jwt.audience=${GROUPIA_JWT_AUDIENCE:groupia-api}
groupia.security.jwt.access-token-ttl=${GROUPIA_JWT_ACCESS_TOKEN_TTL:15m}

# No Groupia commission on new orders. Historical snapshots are unchanged.
groupia.ordering.platform-fee-xof=0
# Do not accept direct-order writes until the public checkout/payment rollout is ready.
groupia.direct-sales.checkout.enabled=${GROUPIA_DIRECT_CHECKOUT_ENABLED:false}
# Independent, opt-in sandbox direct-payment gates. Never enable in production without verification.
groupia.direct-sales.payment-obligation.auto-prepare.enabled=${GROUPIA_DIRECT_PAYMENT_AUTO_PREPARE_ENABLED:false}
groupia.direct-sales.payment-initiation.enabled=${GROUPIA_DIRECT_PAYMENT_INITIATION_ENABLED:false}
# Opt-in address suggestions. Never embed the key in the Angular bundle.
groupia.geoapify.enabled=${GROUPIA_GEOAPIFY_ENABLED:false}
groupia.geoapify.api-key=${GROUPIA_GEOAPIFY_API_KEY:}
groupia.ordering.payment-window-minutes=${GROUPIA_ORDER_PAYMENT_WINDOW_MINUTES:30}
groupia.ordering.tracking-lifetime-days=${GROUPIA_ORDER_TRACKING_LIFETIME_DAYS:180}

groupia.ordering.expiration.enabled=${GROUPIA_ORDER_EXPIRATION_ENABLED:true}
groupia.ordering.expiration.delay=${GROUPIA_ORDER_EXPIRATION_DELAY_MS:60000}
groupia.ordering.expiration.batch-size=${GROUPIA_ORDER_EXPIRATION_BATCH_SIZE:100}
groupia.events.recovery.enabled=${GROUPIA_EVENT_RECOVERY_ENABLED:true}
groupia.payment.webhook-retry.enabled=${GROUPIA_WEBHOOK_RETRY_ENABLED:true}
spring.modulith.events.staleness.published=5m
spring.modulith.events.staleness.processing=5m
spring.modulith.events.staleness.resubmitted=5m

groupia.payment.bictorys.enabled=${BICTORYS_ENABLED:false}
groupia.payment.bictorys.api-url=${BICTORYS_API_URL:https://api.test.bictorys.com}
groupia.payment.bictorys.api-key=${BICTORYS_API_KEY:}
groupia.payment.bictorys.webhook-secret=${BICTORYS_WEBHOOK_SECRET:}
groupia.payment.bictorys.connect-timeout=3s
groupia.payment.bictorys.read-timeout=10s

# Explicit OpenAPI 3.0 output for portable Postman import (springdoc remains 3.1.0).
springdoc.api-docs.version=OPENAPI_3_0

# Passwordless customer access is opt-in until delivery is configured.
groupia.customer-access.enabled=${GROUPIA_CUSTOMER_ACCESS_ENABLED:false}
groupia.customer-access.magic-key-base64=${GROUPIA_CUSTOMER_MAGIC_KEY_BASE64:}
groupia.customer-access.otp-pepper-base64=${GROUPIA_CUSTOMER_OTP_PEPPER_BASE64:}
groupia.customer-access.public-base-url=${GROUPIA_PUBLIC_BASE_URL:http://localhost:4200}

# Outgoing Meta transport: opt-in, never enabled by the local inbox profile.
groupia.notification.whatsapp.enabled=${GROUPIA_WHATSAPP_ENABLED:false}
groupia.notification.whatsapp.otp-enabled=${GROUPIA_WHATSAPP_OTP_ENABLED:false}
groupia.notification.whatsapp.links-enabled=${GROUPIA_WHATSAPP_LINKS_ENABLED:false}
groupia.notification.whatsapp.graph-api-version=${GROUPIA_WHATSAPP_GRAPH_API_VERSION:}
groupia.notification.whatsapp.phone-number-id=${GROUPIA_WHATSAPP_PHONE_NUMBER_ID:}
groupia.notification.whatsapp.access-token=${GROUPIA_WHATSAPP_ACCESS_TOKEN:}
groupia.notification.whatsapp.connect-timeout=${GROUPIA_WHATSAPP_CONNECT_TIMEOUT:3s}
groupia.notification.whatsapp.read-timeout=${GROUPIA_WHATSAPP_READ_TIMEOUT:8s}
groupia.notification.whatsapp.templates.order-confirmed.name=${GROUPIA_WHATSAPP_ORDER_CONFIRMED_TEMPLATE:}
groupia.notification.whatsapp.templates.order-confirmed.language=${GROUPIA_WHATSAPP_ORDER_CONFIRMED_LANGUAGE:}
groupia.notification.whatsapp.templates.order-confirmed.header-parameters=${GROUPIA_WHATSAPP_ORDER_CONFIRMED_HEADER_PARAMETERS:}
groupia.notification.whatsapp.templates.order-confirmed.body-parameters=${GROUPIA_WHATSAPP_ORDER_CONFIRMED_BODY_PARAMETERS:}
groupia.notification.whatsapp.templates.order-confirmed.url-button-index=${GROUPIA_WHATSAPP_ORDER_CONFIRMED_URL_BUTTON_INDEX:}
groupia.notification.whatsapp.templates.order-confirmed.url-prefix=${GROUPIA_WHATSAPP_ORDER_CONFIRMED_URL_PREFIX:}
groupia.notification.whatsapp.templates.order-tracking-link.name=${GROUPIA_WHATSAPP_TRACKING_LINK_TEMPLATE:}
groupia.notification.whatsapp.templates.order-tracking-link.language=${GROUPIA_WHATSAPP_TRACKING_LINK_LANGUAGE:}
groupia.notification.whatsapp.templates.order-tracking-link.header-parameters=${GROUPIA_WHATSAPP_TRACKING_LINK_HEADER_PARAMETERS:}
groupia.notification.whatsapp.templates.order-tracking-link.body-parameters=${GROUPIA_WHATSAPP_TRACKING_LINK_BODY_PARAMETERS:}
groupia.notification.whatsapp.templates.order-tracking-link.url-button-index=${GROUPIA_WHATSAPP_TRACKING_LINK_URL_BUTTON_INDEX:}
groupia.notification.whatsapp.templates.order-tracking-link.url-prefix=${GROUPIA_WHATSAPP_TRACKING_LINK_URL_PREFIX:}
groupia.notification.whatsapp.templates.otp.mode=${GROUPIA_WHATSAPP_OTP_MODE:}
groupia.notification.whatsapp.templates.otp.body-parameters=${GROUPIA_WHATSAPP_OTP_BODY_PARAMETERS:}
groupia.notification.whatsapp.templates.otp.name=${GROUPIA_WHATSAPP_OTP_TEMPLATE:}
groupia.notification.whatsapp.templates.otp.language=${GROUPIA_WHATSAPP_OTP_LANGUAGE:}
groupia.notification.whatsapp.templates.otp.code-expiration-minutes=${GROUPIA_WHATSAPP_OTP_EXPIRATION_MINUTES:}

groupia.payment.bictorys.payouts.enabled=${GROUPIA_BICTORYS_PAYOUTS_ENABLED:false}
groupia.payment.bictorys.payouts.private-key=${GROUPIA_BICTORYS_PRIVATE_KEY:}
groupia.payment.bictorys.payouts.merchant-secret-code=${GROUPIA_BICTORYS_MERCHANT_SECRET_CODE:}

# Separate switch: no real merchant settlement adapter is available in V1.
groupia.settlement.payouts.enabled=${GROUPIA_MERCHANT_PAYOUTS_ENABLED:false}

groupia.subscription.enabled=${GROUPIA_SUBSCRIPTIONS_ENABLED:true}
groupia.subscription.enforcement-enabled=${GROUPIA_SUBSCRIPTION_ENFORCEMENT_ENABLED:false}
groupia.subscription.trial-months=${GROUPIA_SUBSCRIPTION_TRIAL_MONTHS:1}
groupia.subscription.monthly-xof=${GROUPIA_SUBSCRIPTION_MONTHLY_XOF:10000}
# Deprecated legacy provider billing; ignored by invoice/charge flow.
groupia.subscription.bictorys-enabled=${GROUPIA_BICTORYS_SUBSCRIPTIONS_ENABLED:false}
groupia.subscription.bictorys-plan-id=${GROUPIA_BICTORYS_SUBSCRIPTION_PLAN_ID:}

# Trusted socket address only. Edge headers must not redefine rate-limit identities.
server.forward-headers-strategy=none
groupia.security.auth-rate-limit.key-base64=${GROUPIA_AUTH_RATE_LIMIT_KEY_BASE64:${groupia.security.jwt.secret-base64}}

# Hibernate constraint messages can include personal values. Keep the safe API error handler.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.SQL=OFF

# Refresh sessions: independent explicit secret, no fallback to JWT.
groupia.security.session.refresh-pepper-base64=${GROUPIA_REFRESH_TOKEN_PEPPER_BASE64}
groupia.security.session.allowed-origins=${GROUPIA_AUTH_ALLOWED_ORIGINS}
groupia.security.session.cookie-secure=${GROUPIA_AUTH_COOKIE_SECURE:true}

# Product media is opt-in. Local development requires no cloud credentials.
groupia.media.enabled=${GROUPIA_MEDIA_ENABLED:false}
groupia.media.storage-type=${GROUPIA_MEDIA_STORAGE_TYPE:}
groupia.media.public-base-url=${GROUPIA_MEDIA_PUBLIC_BASE_URL:}
groupia.media.local-root=${GROUPIA_MEDIA_LOCAL_ROOT:.groupia-media}
groupia.media.s3.endpoint=${GROUPIA_MEDIA_S3_ENDPOINT:}
groupia.media.s3.region=${GROUPIA_MEDIA_S3_REGION:}
groupia.media.s3.bucket=${GROUPIA_MEDIA_S3_BUCKET:}
groupia.media.s3.access-key=${GROUPIA_MEDIA_S3_ACCESS_KEY:}
groupia.media.s3.secret-key=${GROUPIA_MEDIA_S3_SECRET_KEY:}
groupia.media.s3.path-style-access=${GROUPIA_MEDIA_S3_PATH_STYLE_ACCESS:false}
groupia.media.s3.chunked-encoding-enabled=${GROUPIA_MEDIA_S3_CHUNKED_ENCODING_ENABLED:false}
groupia.media.max-upload-bytes=${GROUPIA_MEDIA_MAX_UPLOAD_BYTES:8388608}
groupia.media.max-width=${GROUPIA_MEDIA_MAX_WIDTH:6000}
groupia.media.max-height=${GROUPIA_MEDIA_MAX_HEIGHT:6000}
groupia.media.max-pixels=${GROUPIA_MEDIA_MAX_PIXELS:24000000}
groupia.media.processing-concurrency=${GROUPIA_MEDIA_PROCESSING_CONCURRENCY:1}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.servlet.multipart.file-size-threshold=0

# Purely local simulations: never enable an actual provider transfer.
groupia.marketplace.simulation.enabled=${GROUPIA_MARKETPLACE_SIMULATION_ENABLED:false}
groupia.marketplace.simulation.fee-xof=${GROUPIA_MARKETPLACE_SIMULATION_FEE_XOF:200}
groupia.marketplace.simulation.company-budget-xof=${GROUPIA_MARKETPLACE_SIMULATION_COMPANY_BUDGET_XOF:100000}

#---
spring.config.activate.on-profile=!prod
# Local dotenv loading is profile-scoped; overriding spring.config.import later does not undo imports.
spring.config.import=optional:file:.env[.properties]

# SasPay V1: test keys only. No SasPay payout adapter is registered.
groupia.payment.saspay.enabled=${SASPAY_ENABLED:false}
groupia.payment.saspay.api-key=${SASPAY_API_KEY:}
groupia.payment.saspay.webhook-secret=${SASPAY_WEBHOOK_SECRET:}
groupia.payment.saspay.merchant-id=${SASPAY_MERCHANT_ID:}
groupia.payment.saspay.checkout-hosts=${SASPAY_CHECKOUT_HOSTS:}
