<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Groupia — Autorisation administrative DIR-24</title><style>body{max-width:760px;margin:64px auto;padding:24px;font:18px system-ui;color:#17332f;background:#f7faf8}button{padding:14px;margin:8px 8px 8px 0;font:inherit}pre{white-space:pre-wrap}p{line-height:1.6}</style><h1>Autorisation administrative DIR-24</h1><p>INDEPENDENT_PILOT · 1 000 XOF brut maximum · Wave •••8577 · Validité 30 minutes.<br>DIR-21 conserve ses 1 000 XOF réservés. Les transferts LIVE restent fermés.</p><button id="session">Vérifier ma session opérateur</button><button id="grant" disabled>Enregistrer uniquement le grant DIR-24</button><pre id="result" role="status">Aucune opération administrative envoyée.</pre><script>
(()=>{'use strict';
const expectedOrigin='https://compute-footwear-arrives-worlds.trycloudflare.com';
const org='b95a0515-1bcf-4740-8417-c594d02f211e',actor='886174d5-26fb-46ba-b7a3-4d8f0bfdd91d',old='e1ecc9ae-89ab-449f-bc91-1a7e59f03a0e',target='f1d691db-b561-4412-8149-3314b5f6955b';
const approved={"action": "INDEPENDENT_PILOT", "approvalReference": "GROUPIA-INDEPENDENT-DIR24-20261117", "expectedVersion": 5, "reason": "Pilote DIR-24 independant, reserve DIR-21 conservee, revue des deux collectes et de la destination existante.", "confirmed": true};
let token=null,submitted=false;
const result=document.getElementById('result'),session=document.getElementById('session'),grant=document.getElementById('grant');
function fail(e){result.textContent='Opération interrompue : '+(e.message||'contrôle non satisfait');grant.disabled=true;}
async function checked(path,options){if(location.origin!==expectedOrigin)throw Error('Origine non autorisée');const r=await fetch(path,{...options,credentials:'same-origin',redirect:'error',cache:'no-store',signal:AbortSignal.timeout(15000)});const data=await r.json();if(!r.ok)throw Error('HTTP '+r.status+' '+(typeof data.code==='string'&&/^[A-Z0-9_]+$/.test(data.code)?data.code:''));return data;}
session.onclick=async()=>{session.disabled=true;try{const s=await checked('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json','X-Groupia-Auth':'1'}});if(typeof s.accessToken!=='string')throw Error('Session absente');const part=s.accessToken.split('.')[1];const claims=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/')));if(claims.sub!==actor)throw Error('Opérateur différent du dossier');token=s.accessToken;const b=await checked('/api/organizations/'+org+'/merchant-balance',{method:'GET',headers:{Authorization:'Bearer '+token}});const d=b.directOrders?.find(d=>d.directOrderId===target);if(!d||Number(d.grossMerchantCollections)!==1000||Number(d.reservedForPayout)!==0||Number(b.reservedForPayout)!==1000||Number(b.merchantPayouts)!==0)throw Error('Contrôle financier non satisfait');result.textContent='Session opérateur vérifiée. DIR-24 : 1 000 XOF collectés, 0 réservé. Réserve globale : 1 000 XOF. Aucun grant envoyé.';grant.disabled=false;}catch(e){token=null;fail(e);}finally{session.disabled=false;}};
grant.onclick=async()=>{if(!token||submitted)return;submitted=true;grant.disabled=true;session.disabled=true;result.textContent='Décision administrative en cours…';try{const r=await checked('/api/organizations/'+org+'/merchant-payouts/'+old+'/administration',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(approved)});if(r.payoutId!==old||r.status!=='REVIEW_REQUIRED'||!r.authorizationId)throw Error('Résultat à rapprocher en base');result.textContent='Grant administratif enregistré.\nIdentifiant : '+r.authorizationId+'\nAncien retrait : REVIEW_REQUIRED, conservé.\nAucun transfert envoyé.';}catch(e){fail(e);result.textContent+='\nNe pas relancer : vérifier le résultat en base.';}finally{token=null;}};
})();</script></html>
