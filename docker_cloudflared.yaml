name: groupia-cloudflare

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: groupia-cloudflared
    restart: unless-stopped

    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?CLOUDFLARED_TUNNEL_TOKEN is required}

    command:
      - tunnel
      - --no-autoupdate
      - run

    extra_hosts:
      - "host.docker.internal:host-gateway"