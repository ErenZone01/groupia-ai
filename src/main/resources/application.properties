spring.application.name=groupia-ai
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
groupia.security.jwt.secret-base64=${GROUPIA_JWT_SECRET_BASE64}
groupia.security.jwt.issuer=${GROUPIA_JWT_ISSUER:groupia}
groupia.security.jwt.audience=${GROUPIA_JWT_AUDIENCE:groupia-api}
groupia.security.jwt.access-token-ttl=${GROUPIA_JWT_ACCESS_TOKEN_TTL:15m}
